version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sus-postgres
    environment:
      POSTGRES_DB: susdb
      POSTGRES_USER: sususer
      POSTGRES_PASSWORD: suspass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sususer -d susdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sus-backend
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/susdb
      SPRING_DATASOURCE_USERNAME: sususer
      SPRING_DATASOURCE_PASSWORD: suspass
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sus-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
