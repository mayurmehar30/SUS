spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/susdb
    username: sususer
    password: suspass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8090
  servlet:
    context-path: /

app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTTokenGeneration2024SUSProject
    expiration: 86400000
  upload-dir: uploads
  base-url: http://localhost:8090

logging:
  level:
    com.sus: DEBUG
    org.springframework.security: INFO
